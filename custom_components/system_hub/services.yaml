containers_refresh:

watchdog_check:
watchdog_reset:
  fields:
    entry_id:
      required: true
      example: 01JABCDEF0123456789ABCDEFG
      selector:
        config_entry:

marketplace_check_updates:
  fields:
    wait:
      default: false
      selector:
        boolean:

marketplace_check_repository:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          multiple: true
          integration: marketplace
          domain: update

marketplace_install_updates:
  fields:
    entity_id:
      selector:
        entity:
          multiple: true
          integration: marketplace
          domain: update
    wait:
      default: false
      selector:
        boolean:
    backup:
      selector:
        boolean:

batteries_notify:
batteries_export:
  fields:
    path:
      example: "/config/system_hub_batteries.csv"
      selector:
        text:
batteries_set_stock:
  fields:
    battery_type:
      required: true
      example: "AA"
      selector:
        text:
    count:
      example: 4
      selector:
        number:
          min: 0
          max: 999
          mode: box

git_sync_commit_push:
  fields:
    message:
      example: "fix: corridor light threshold"
      selector:
        text:

git_sync_export_dashboards:

git_sync_generate_ssh_key:

git_sync_generate_message:

git_sync_get_diff:

git_sync_pull:

orphans_scan:
orphans_remove:
  fields:
    entities:
      required: true
      example: "sensor.old_temperature"
      selector:
        text:
          multiple: true
orphans_ignore:
  fields:
    entities:
      example: "sensor.kept_on_purpose"
      selector:
        text:
          multiple: true
    devices:
      example: "3b1f0c2e9d8a4f6b"
      selector:
        text:
          multiple: true
orphans_remove_devices:
  fields:
    devices:
      required: false
      example: "3b1f0c2e9d8a4f6b"
      selector:
        text:
          multiple: true
