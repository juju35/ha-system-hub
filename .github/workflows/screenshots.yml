name: Screenshots

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "custom_components/**/frontend/**"
      - "scripts/**"
      - "custom_components/**/translations/en.json"
      - ".github/workflows/screenshots.yml"

# Protected main is never pushed to: the job commits the refreshed screenshots
# back onto the pull request's own branch, so they land through the normal merge.
# A push made with GITHUB_TOKEN starts pull_request workflows that then wait for an
# approval: the commit says [skip ci] so none is started, and the job re-runs the PR
# checks on the screenshot commit itself as workflow_dispatch runs (hence actions: write),
# which [skip ci] does not stop.
permissions:
  contents: write
  actions: write

concurrency:
  group: screenshots-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Render screenshots
    runs-on: ubuntu-latest
    # Debian 12 rather than the Ubuntu runner: its apt mirrors (deb.debian.org) instead of Ubuntu's archives, which the
    # runners sometimes cannot resolve.
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fork PR branches do not exist in this repository: only check out the
          # head branch for same-repo PRs (where screenshots get pushed back).
          # Everything else keeps the default ref — for a fork PR that is the merge
          # ref, which github.ref_name ("N/merge") does not resolve to.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
      # The checkout belongs to another user than the container's root: git refuses it otherwise.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Python, ffmpeg (required), Roboto, then Playwright with Chromium and its libraries, from Debian's mirrors: each
      # apt call time-boxed and retried so a flaky mirror is abandoned and retried instead of hanging.
      - name: Install Python, ffmpeg, Roboto and Chromium
        timeout-minutes: 20
        run: |
          ok=
          for i in 1 2 3; do
            timeout 150 apt-get update \
              && timeout 300 apt-get install -y --no-install-recommends python3 python3-venv ffmpeg fonts-roboto \
              && ok=1 && break
            echo "apt attempt $i failed or timed out, retrying in 15s"; sleep 15
          done
          [ -n "$ok" ] || { echo "::error::apt failed 3 times"; exit 1; }
          python3 -m venv /opt/venv
          echo /opt/venv/bin >> "$GITHUB_PATH"
          /opt/venv/bin/pip install -q playwright==1.64.1
          ok=
          for i in 1 2 3; do
            timeout 300 /opt/venv/bin/playwright install --with-deps chromium && ok=1 && break
            echo "chromium attempt $i failed or timed out, retrying in 15s"; sleep 15
          done
          [ -n "$ok" ] || { echo "::error::chromium install failed 3 times"; exit 1; }
          ffmpeg -version > /dev/null
      - name: Render screenshots
        run: |
          set -o pipefail
          # The panel (screenshots.py) and every card (screenshots_<card>.py)
          for script in scripts/screenshots*.py; do
            python "$script" 2>&1 | tee -a /tmp/screenshots.log || {
              echo "::error::$script failed: $(tail -c 1200 /tmp/screenshots.log | tr -d '\r' | tr '\n' ' ')"
              exit 1
            }
          done
      # Only same-repo pull requests get the refreshed screenshots committed back:
      # fork PRs have a read-only token and manual runs must never push.
      - name: Commit refreshed screenshots
        id: commit
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -z "$(git status --porcelain screenshots)" ]; then
            echo "No screenshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          git commit -m "chore: refresh screenshots [skip ci]"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Re-run checks on the screenshot commit
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment, never expanded into the script: a branch name cannot inject commands.
          HEAD_REF: ${{ github.head_ref }}
          REPO: ${{ github.repository }}
        # The REST API rather than gh, which the container does not have
        run: |
          for wf in lint.yml validate.yml hacs.yml; do
            [ -f ".github/workflows/$wf" ] || continue
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/$wf/dispatches" \
              -d "$(python3 -c 'import json, os; print(json.dumps({"ref": os.environ["HEAD_REF"]}))')"
          done
      - name: Upload screenshots artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots/
