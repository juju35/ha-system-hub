name: Screenshots

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "custom_components/**/frontend/**"
      - "scripts/**"
      - "src/**"
      - "custom_components/**/translations/en.json"
      - ".github/workflows/screenshots.yml"

# Protected main is never pushed to: the job commits the refreshed screenshots
# back onto the pull request's own branch, so they land through the normal merge.
# The push uses the juju35-screenshots GitHub App token, not GITHUB_TOKEN: a push made with
# GITHUB_TOKEN starts no workflow, which left the required checks "Expected" on the bot commit.
permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Render screenshots
    # The bot's own screenshots commit re-triggers this workflow: skip it (a skipped job counts as passed),
    # so a render that is not byte-identical can never loop.
    if: github.actor != 'juju35-screenshots[bot]'
    runs-on: ubuntu-latest
    # Debian 12 rather than the Ubuntu runner: its apt mirrors (deb.debian.org) instead of Ubuntu's archives, which the
    # runners sometimes cannot resolve.
    container: node:22-bookworm
    # The container's default shell is sh: bash for pipefail and the scripts
    defaults:
      run:
        shell: bash
    steps:
      # Same-repo PRs only (fork and Dependabot runs get no Actions secrets): they are the ones pushed back to.
      - name: App token
        id: app-token
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checkout keeps this token for the push below: the App's push triggers the PR checks.
          token: ${{ steps.app-token.outputs.token || github.token }}
          # Fork PR branches do not exist in this repository: only check out the
          # head branch for same-repo PRs (where screenshots get pushed back).
          # Everything else keeps the default ref — for a fork PR that is the merge
          # ref, which github.ref_name ("N/merge") does not resolve to.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
      # The checkout belongs to another user than the container's root: git refuses it otherwise.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The panel and the cards the screenshots load are assembled from src/ (not committed).
      - name: Build the frontend
        run: |
          npm install --no-save --no-package-lock acorn@8.19.0
          node scripts/build-frontend.mjs
      # Python, ffmpeg (required), Roboto, then Playwright with Chromium and its libraries, from Debian's mirrors: each
      # apt call time-boxed and retried so a flaky mirror is abandoned and retried instead of hanging.
      - name: Install Python, ffmpeg, Roboto and Chromium
        timeout-minutes: 20
        run: |
          ok=
          for i in 1 2 3; do
            timeout 150 apt-get update \
              && timeout 300 apt-get install -y --no-install-recommends python3 python3-venv ffmpeg fonts-roboto \
              && ok=1 && break
            echo "apt attempt $i failed or timed out, retrying in 15s"; sleep 15
          done
          [ -n "$ok" ] || { echo "::error::apt failed 3 times"; exit 1; }
          python3 -m venv /opt/venv
          echo /opt/venv/bin >> "$GITHUB_PATH"
          /opt/venv/bin/pip install -q playwright==1.64.1
          ok=
          for i in 1 2 3; do
            timeout 300 /opt/venv/bin/playwright install --with-deps chromium && ok=1 && break
            echo "chromium attempt $i failed or timed out, retrying in 15s"; sleep 15
          done
          [ -n "$ok" ] || { echo "::error::chromium install failed 3 times"; exit 1; }
          ffmpeg -version > /dev/null
      - name: Render screenshots
        run: |
          set -o pipefail
          # The panel (screenshots.py) and every card (screenshots_<card>.py)
          for script in scripts/screenshots*.py; do
            python "$script" 2>&1 | tee -a /tmp/screenshots.log || {
              echo "::error::$script failed: $(tail -c 1200 /tmp/screenshots.log | tr -d '\r' | tr '\n' ' ')"
              exit 1
            }
          done
      - name: Commit refreshed screenshots
        if: steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if [ -z "$(git status --porcelain screenshots)" ]; then
            echo "No screenshot changes."
            exit 0
          fi
          BOT_ID="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/users/${APP_SLUG}%5Bbot%5D" | grep -m1 -o '"id": *[0-9]*' | grep -o '[0-9]*$')"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add screenshots
          git commit -m "chore: refresh screenshots"
          git push
      - name: Upload screenshots artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots/
